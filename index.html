<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aula</title>

  <style>
    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family: Calibri, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background:#6b6b6b;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .frame{
      width: min(520px, 100%);
      margin: 24px auto;
      background:#fff;
      padding: 22px 18px 28px;
      border-radius: 10px;
    }

    /* header come nello screenshot: logo centrato, lingua in alto a dx */
    .top{
      position: relative;
      text-align: center;
      padding-top: 6px;
    }

    .logo{
      width: min(360px, 82vw);   /* dimensione “grande” come screenshot */
      height: auto;
      max-width: 100%;
      display:block;
      margin: 6px auto 0;
    }

    .lang{
      position: absolute;
      top: 10px;
      right: 10px;
      background:#b3261e;
      color:#fff;
      border:0;
      width: 56px;
      height: 56px;
      font-weight:700;
      cursor:pointer;
      border-radius: 12px;
    }

    h1{
      text-align:center;
      font-size: clamp(26px, 7vw, 36px);
      margin: 14px 0 18px;
      font-weight:600;
      line-height: 1.15;
    }

    .btn{
      display:block;
      width:100%;
      text-align:center;
      text-decoration:none;
      background:#b3261e;
      color:#fff;
      padding: clamp(18px, 5vw, 26px) clamp(14px, 4vw, 18px);
      font-size: clamp(22px, 6vw, 34px);
      margin: 16px 0;
      border-radius: 12px;
      line-height: 1.1;
    }

    @media (max-width: 480px){
      .frame{
        margin: 0;
        min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        border-radius: 0;
        padding: 18px 16px 24px;
      }
      .lang{
        top: 8px;
        right: 8px;
        width: 54px;
        height: 54px;
      }
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="top">
      <img class="logo" src="unibo-logo-big.png" alt="Alma Mater Studiorum – Università di Bologna" />
      <button class="lang" id="langBtn">EN</button>
    </div>

    <h1 id="roomTitle">Aula 1.3</h1>

    <a class="btn" id="mapBtn" href="#" target="_blank" rel="noopener">Mappa</a>
    <a class="btn" id="reportBtn" href="#" target="_blank" rel="noopener">Segnalazioni</a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get("room") || "1.3";
    let lang = params.get("lang") || "it";

    const strings = {
      it: { title: `Aula ${room}`, map: "Mappa", report: "Segnalazioni", langBtn: "EN" },
      en: { title: `Room ${room}`, map: "Map", report: "Reports", langBtn: "IT" }
    };

    const MAP_URL = "https://app.mappedin.com/map/681891b804e97f000b1e1311?location=s_369f00ba922d6aff";
    const REPORT_BASE = "https://tuosito.it/segnalazioni";

    function render() {
      document.documentElement.lang = lang;
      document.getElementById("roomTitle").textContent = strings[lang].title;
      document.getElementById("mapBtn").textContent = strings[lang].map;
      document.getElementById("reportBtn").textContent = strings[lang].report;
      document.getElementById("langBtn").textContent = strings[lang].langBtn;

      document.getElementById("mapBtn").href = MAP_URL;
      document.getElementById("reportBtn").href =
        `${REPORT_BASE}?room=${encodeURIComponent(room)}&lang=${lang}`;
    }

    document.getElementById("langBtn").addEventListener("click", () => {
      lang = (lang === "it") ? "en" : "it";
      params.set("lang", lang);
      history.replaceState({}, "", `${location.pathname}?${params.toString()}`);
      render();
    });

    render();
  </script>
</body>
</html>
